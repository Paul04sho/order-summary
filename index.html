<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Order summary card</title>
 <!-- Lien CSS -->
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
<main class="card-container">
  <!-- Image d'illustration -->
   <img src="./images/illustration-hero.svg" alt="Illustration Hero" class="card-image">

   <!-- Contenu de la carte-->
    <div class="card-content">
      <h1>Order Summary</h1>
      <p>
        You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!
      </p>

      <!-- Détails du plan d'abonnement -->
      <div class="plan-box">
        <div class="plan-details">
          <img src="./images/icon-music.svg" alt="Icon Music" class="plan-icon">
          <div class="plan-info">
            <h3>Annual Plan</h3>
            <p>$59.99/year</p>
          </div>
           <a href="#" class="change-link">Change</a>
        </div>
      </div>

      <!-- Boutons d'action -->
       <button class="proceed-button">Proceed to Payment</button>
       <button class="cancel-button">Cancel Order</button>
    </div>
</main>
</body>
</html>
